name: Build encre Binary

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── All locales (default full build) ──────────────────────────────
          - os: ubuntu-latest
            target: linux-x64
            arch: x64
            locale: all
          - os: ubuntu-24.04-arm
            target: linux-arm64
            arch: arm64
            locale: all
          - os: windows-latest
            target: windows-x64
            arch: x64
            locale: all
          - os: windows-11-arm
            target: windows-arm64
            arch: arm64
            locale: all
          - os: macos-13
            target: macos-x64
            arch: x64
            locale: all
          - os: macos-latest
            target: macos-arm64
            arch: arm64
            locale: all
          # ── Simplified locales per platform ───────────────────────────────
          - os: ubuntu-latest
            target: linux-x64-cn
            arch: x64
            locale: cn
          - os: ubuntu-24.04-arm
            target: linux-arm64-cn
            arch: arm64
            locale: cn
          - os: windows-latest
            target: windows-x64-cn
            arch: x64
            locale: cn
          - os: windows-11-arm
            target: windows-arm64-cn
            arch: arm64
            locale: cn
          - os: macos-13
            target: macos-x64-cn
            arch: x64
            locale: cn
          - os: macos-latest
            target: macos-arm64-cn
            arch: arm64
            locale: cn
          - os: ubuntu-latest
            target: linux-x64-en
            arch: x64
            locale: en
          - os: windows-latest
            target: windows-x64-en
            arch: x64
            locale: en
          - os: macos-13
            target: macos-x64-en
            arch: x64
            locale: en

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Build
        run: python build.py --locales ${{ matrix.locale }}
        env:
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: encre-${{ matrix.target }}
          path: |
            Encre*Setup*.exe
            Encre*.pkg
            encre*.deb
            encre*.rpm

      - name: Upload Python library wheels
        uses: actions/upload-artifact@v4
        with:
          name: encre-wheels-${{ matrix.target }}
          path: dist/wheels/*.whl

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: encre-server-${{ matrix.target }}
          path: build/server/encre-server/
