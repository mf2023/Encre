[package]
name = "yim-core"
version = "0.1.0"
edition = "2021"
description = "Core Rust library for Ymi Agent Framework"

[features]
default = []
embedding = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers"]
simd = ["dep:wide"]
landlock = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ignore = "0.4"
walkdir = "2"
similar = "2"
sha2 = "0.10"
glob = "0.3"
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true }
wide = { version = "0.7", optional = true }