[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-skill-data-intel-profiler"
version = "0.4.3"
description = "EA (Encre Agent) system-default skill: data-intel-profiler."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Dunimd Team", email = "dunimd@outlook.com"}]
keywords = ["ea", "agent", "skill", "data-intel-profiler", "system-default"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["encre-harness>=0.4.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.entry-points."ea.plugins"]
data-intel-profiler = "ea_skill_data_intel_profiler.plugin:create_plugin"

[tool.ea]
tier = "system-default"

[tool.setuptools.packages.find]
where = ["."]
include = ["ea_skill_data_intel_profiler*"]

[tool.setuptools.package-data]
"ea_skill_data_intel_profiler" = ["skills/**/*"]
