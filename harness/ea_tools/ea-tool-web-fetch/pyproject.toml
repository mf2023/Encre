[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-tool-web-fetch"
version = "0.4.3"
description = "EA (Encre Agent) — mandatory web fetch tool. Fetch URLs via Exa crawler (JS rendering) with httpx fallback."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Dunimd Team", email = "dunimd@outlook.com"}]
keywords = ["ea", "agent", "tool", "web-fetch", "mandatory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["encre-harness>=0.4.3", "httpx>=0.27", "markdownify>=0.12", "beautifulsoup4>=4.12", "lxml>=5.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.entry-points."ea.plugins"]
web-fetch = "ea_tool_web_fetch.plugin:create_plugin"

[tool.ea]
tier = "mandatory"

[tool.setuptools.packages.find]
where = ["."]
include = ["ea_tool_web_fetch*"]

[tool.setuptools.package-data]
"ea_tool_web_fetch" = ["skills/**/*.md"]
