[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-tool-memory"
version = "0.4.3"
description = "EA (Encre Agent) — system-default memory_create, memory_delete, memory_profile, memory_read, memory_search, memory_update tool(s)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Dunimd Team", email = "dunimd@outlook.com"}]
keywords = ["ea", "agent", "tool", "system-default"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = ["encre-harness>=0.4.3"]

[project.entry-points."ea.plugins"]
memory_create = "ea_tool_memory.plugin:create_plugin"

[tool.ea]
tier = "system-default"

[tool.setuptools.packages.find]
where = ["."]
include = ["ea_tool_memory*"]

[tool.setuptools.package-data]
"ea_tool_memory" = ["skills/**/*.md"]
