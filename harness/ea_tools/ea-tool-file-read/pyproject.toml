[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-tool-file-read"
version = "0.4.3"
description = "EA (Encre Agent) — mandatory file read tool. Reads text, images, PDFs with pagination and binary detection."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Dunimd Team", email = "dunimd@outlook.com"}]
keywords = ["ea", "agent", "tool", "file-read", "mandatory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["encre-harness>=0.4.3", "pypdf>=4.0", "PyPDF2>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.entry-points."ea.plugins"]
file-read = "ea_tool_file_read.plugin:create_plugin"

[tool.ea]
tier = "mandatory"

[tool.setuptools.packages.find]
where = ["."]
include = ["ea_tool_file_read*"]

[tool.setuptools.package-data]
"ea_tool_file_read" = ["skills/**/*.md"]
