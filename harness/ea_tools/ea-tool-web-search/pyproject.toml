[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-tool-web-search"
version = "0.4.3"
description = "EA (Encre Agent) — mandatory web search tool. Search via Exa MCP with inline page content, zero config needed."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Dunimd Team", email = "dunimd@outlook.com"}]
keywords = ["ea", "agent", "tool", "web-search", "mandatory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["encre-harness>=0.4.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.entry-points."ea.plugins"]
web-search = "ea_tool_web_search.plugin:create_plugin"

[tool.ea]
tier = "mandatory"

[tool.setuptools.packages.find]
where = ["."]
include = ["ea_tool_web_search*"]

[tool.setuptools.package-data]
"ea_tool_web_search" = ["skills/**/*.md"]
