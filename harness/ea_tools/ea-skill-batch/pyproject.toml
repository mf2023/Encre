[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-skill-batch"
version = "0.4.3"
description = "EA (Encre Agent) system-default skill: batch."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Dunimd Team", email = "dunimd@outlook.com"}]
keywords = ["ea", "agent", "skill", "batch", "system-default"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["encre-harness>=0.4.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.entry-points."ea.plugins"]
batch = "ea_skill_batch.plugin:create_plugin"

[tool.ea]
tier = "system-default"

[tool.setuptools.packages.find]
where = ["."]
include = ["ea_skill_batch*"]

[tool.setuptools.package-data]
"ea_skill_batch" = ["skills/**/*"]
