[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "yim"
version = "0.1.0"
description = "Flagship-level general-purpose AI Agent framework library"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
    "lxml>=5.1",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["yim*"]

[tool.setuptools-rust]
module = "yim._native"

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
ollama = ["ollama>=0.1"]
native = ["yim-native==0.1.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["asyncio: mark a test as an async test"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["crates", "_native.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["SIM", "ARG", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["crates/", "build/", "dist/"]
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true