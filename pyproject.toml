[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "encre"
version = "0.3.0"
description = "Encre — Python agent framework (the core AI Agent package of the Encre project)"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
    "lxml>=5.1",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "pyyaml>=6.0",
    "cryptography>=41.0",
    "zero-api-key-web-search>=23.0",
    "pathspec>=0.12",
    "websockets>=12.0,<14",
    "Pillow>=10.0",
    "tiktoken>=0.5",
    "numpy>=1.24",
    "loguru>=0.7",
    "mss>=9.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.10",
    "pyautogui>=0.9",
    "pypdf>=4.0",
    "PyPDF2>=3.0",
    "pytesseract>=0.3",
    "uiautomation>=2.0",
    "watchfiles>=0.21",
    "tree-sitter>=0.21",
    "tree-sitter-language-pack>=0.6",
    "psutil>=6.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["encre*"]

[tool.setuptools.package-data]
# Non-Python resources shipped with the package.  Without this, wheels / frozen
# builds silently drop .prompt and .md files, breaking built-in skills/prompts.
"encre" = ["*.txt"]
"encre.prompts" = ["**/*.prompt"]
"encre.skills.builtin" = ["**/*.md"]

# [tool.setuptools-rust]
# module = "backend.encre._native"
# (manual: _native.pyd is copied into backend/encre/ during setup)

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
ollama = ["ollama>=0.1"]
native = ["encre-native==0.3.0"]
aiohttp = ["aiohttp>=3.9"]
discord = ["discord.py>=2.3", "PyNaCl>=1.5"]
slack = ["slack_bolt>=1.18", "slack_sdk>=3.27"]
telegram = ["python-telegram-bot>=20.0"]
dingtalk = ["dingtalk-stream>=0.15"]
qqbot = ["aiohttp>=3.9", "httpx>=0.27", "cryptography>=41.0", "qrcode>=7.0"]
email = ["aioimaplib>=1.1", "aiosmtplib>=1.0"]
matrix = ["mautrix>=0.20"]
feishu = ["lark-oapi>=1.0"]
google_chat = ["google-api-python-client>=2.0", "google-auth-httplib2>=0.2", "google-auth-oauthlib>=1.0", "httplib2>=0.22"]
teams = ["microsoft-teams>=0.1"]
sms = ["twilio>=8.0"]
local = ["torch>=2.0", "transformers>=4.36"]
aws = ["boto3>=1.34"]
tracing = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-grpc>=1.25"]

# --- Platform-specific desktop automation extras ---
# Each group only works on its target OS.
# Model users pick the one matching their platform:
#   pip install encre[windows]    # Windows
#   pip install encre[macos]      # macOS
windows = [
    "winrt-Windows.Media.Ocr>=1.0",       # WinRT OCR (Win 10+ built-in)
    "winrt-Windows.Devices.Geolocation>=1.0",  # Native GPS location
    "winrt-Windows.Devices.Sensors>=1.0",      # Accelerometer/gyro/light sensors
    "pywin32>=306",                        # GPU/sensor/display info via WMI
]
macos = [
    "pyobjc-framework-Cocoa>=10",         # Foundation/NSData for Vision OCR
    "pyobjc-framework-Vision>=10",        # macOS Vision.framework OCR
    "pyobjc-framework-ApplicationServices>=10",  # Accessibility AX API
    "pyobjc-framework-CoreLocation>=10",  # Device location
    "pyobjc-framework-CoreGraphics>=10",  # Display info
]
linux = [
    "dbus-python>=1.3",                  # D-Bus bindings for GeoClue2 location
    "PyGObject>=3.50",                   # GLib main loop for GeoClue2
]

# --- Database driver extras (optional) ---
database-sqlite = ["aiosqlite>=0.20"]
database-postgresql = ["asyncpg>=0.29"]
database-mysql = ["aiomysql>=0.2"]
database-mssql = ["pymssql>=2.2"]
database-oracle = ["oracledb>=2.0"]
database-duckdb = ["duckdb>=1.0"]
database-clickhouse = ["clickhouse-driver>=0.2"]
database-mongodb = ["motor>=3.0"]
database-redis = ["redis>=5.0"]
database-all = [
    "encre[database-sqlite,database-postgresql,database-mysql,database-mssql,database-oracle,database-duckdb,database-clickhouse,database-mongodb,database-redis]",
]

all = [
    "encre[anthropic,ollama,native,aiohttp,discord,slack,telegram,dingtalk,qqbot,email,matrix,feishu,google_chat,teams,sms,local,aws,tracing,windows,macos,database-all]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = ["asyncio: mark a test as an async test"]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = ["crates", "_native.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/*" = ["SIM", "ARG", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["crates/", "build/", "dist/"]
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
