appId: com.encre.desktop
productName: Encre Agent Desktop
artifactName: "EA Setup ${version}.${ext}"
copyright: "Copyright © 2025-2026 Dunimd Team"

directories:
  output: release
  buildResources: assets

buildDependenciesFromSource: false

files:
  - dist/**/*
  - renderer/**/*
  - "!renderer/src/**/*"
  - "!renderer/tsconfig.json"
  # Unused 66MB demo video (no code references it) — keep it out of the installer.
  - "!renderer/assets/*.mp4"
  # Dead build artifacts / unused icon fonts (nothing references them).
  - "!renderer/devicon.css"
  - "!renderer/fonts/**/*"
  - "!renderer/dist/**/*"

extraResources:
  - from: ../build/server/encre-server
    to: encre-server
    filter:
      - "**/*"
  # Legal/policy docs (privacy, terms, agreements) plus the license and
  # thanks text. The interactive VitePress help site (docs/help) is an
  # external deliverable and intentionally NOT packaged.
  - from: ../docs/legal
    to: docs/legal
    filter:
      - "**/*.md"
  - from: ../docs/THANKS.md
    to: docs/THANKS.md
  - from: ../docs/THANKS_CN.md
    to: docs/THANKS_CN.md
  - from: ../LICENSE
    to: LICENSE

win:
  target:
    - target: nsis
      arch: [x64]
  icon: renderer/assets/Encre.ico
  signAndEditExecutable: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: pkg
      arch: [x64, arm64]

linux:
  target:
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  category: Utility
