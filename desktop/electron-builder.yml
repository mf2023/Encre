appId: com.encre.desktop
productName: Encre
copyright: "Copyright © 2025-2026 Dunimd Team"

directories:
  output: release
  buildResources: assets

buildDependenciesFromSource: false

files:
  - dist/**/*
  - renderer/**/*
  - "!renderer/src/**/*"
  - "!renderer/tsconfig.json"
  # Unused 66MB demo video (no code references it) — keep it out of the installer.
  - "!renderer/assets/*.mp4"
  # Dead build artifacts / unused icon fonts (nothing references them).
  - "!renderer/devicon.css"
  - "!renderer/fonts/**/*"
  - "!renderer/dist/**/*"

extraResources:
  - from: ../build/server/encre-server
    to: encre-server
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: pkg
      arch: [x64, arm64]

linux:
  target:
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  category: Utility
