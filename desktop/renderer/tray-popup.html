<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
/* ── Theme tokens (light default) ── */
:root,[data-theme="light"]{
  --tp-bg:#ffffff;--tp-color:#1f1f1f;--tp-hover:#f5f5f5;--tp-border:#f0f0f0;
  --tp-line:#e8e8e8;--tp-scrollbar:#ddd;--tp-sub-color:#999;
  --tp-name:#1f1f1f;--tp-meta:#888;--tp-empty:#bbb;--tp-badge-bg:#eef2ff;
  --tp-badge-color:#4f46e5;  --tp-dot:#ccc;--tp-sep:#f0f0f0;--tp-bg-tertiary:#f0f0f0;--tp-accent:#666;
  color-scheme:light;
  /* Map tray palette to the shared .seg component variables
     (defined in _components.css). Both surfaces now resolve through
     the same CSS component, ensuring identical UI + animations. */
  --seg-bg:#eeeeee;--seg-active-bg:#ffffff;--seg-text:#666;--seg-text-hover:#1f1f1f;--seg-active-text:#1f1f1f;
}
[data-theme="dark"]{
  --tp-bg:#1a1a1a;--tp-color:#e5e5e5;--tp-hover:#262626;--tp-border:#333333;
  --tp-line:#333333;--tp-scrollbar:#444;--tp-sub-color:#777;
  --tp-name:#e5e5e5;--tp-meta:#888;--tp-empty:#666;--tp-badge-bg:#1e1b4b;
  --tp-badge-color:#a5b4fc;  --tp-dot:#555;--tp-sep:#2a2a2a;--tp-bg-tertiary:#2a2a2a;--tp-accent:#999;
  color-scheme:dark;
  --seg-bg:#2a2a2a;--seg-active-bg:#3a3a3a;--seg-text:#999;--seg-text-hover:#f5f5f5;--seg-active-text:#f5f5f5;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--tp-bg);color:var(--tp-color);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;font-size:13px;display:flex;flex-direction:column}
#sessions-container{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.slide-exit{animation:slideOut 0.18s cubic-bezier(0.4,0,0.2,1) forwards}
.slide-enter{animation:slideIn 0.18s cubic-bezier(0.4,0,0.2,1) forwards}
@keyframes slideOut{to{transform:translateX(-100%);opacity:0}}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
#sessions-container::-webkit-scrollbar{width:4px}
#sessions-container::-webkit-scrollbar-track{background:transparent}
#sessions-container::-webkit-scrollbar-thumb{background:var(--tp-scrollbar);border-radius:2px}
/* ── Header row: title + segmented control ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;gap:8px}
.sub{font-size:11px;font-weight:600;color:var(--tp-sub-color);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.sub svg.icon{width:12px;height:12px;opacity:.5;flex-shrink:0}
.ws-tree-session-item{position:relative;flex-shrink:0;display:flex;flex-direction:column;padding:9px 12px;border-radius:6px;cursor:pointer;margin-bottom:1px;color:var(--tp-name);font-size:13px;transition:background .1s}
.ws-tree-session-item:hover{background:var(--tp-hover)}
.ws-tree-session-item.active{background:transparent;color:var(--tp-color)}
.session-item-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.session-preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.session-running{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0}
.ws-tree-node{margin-bottom:2px}
.ws-tree-node-header{display:flex;align-items:center;gap:5px;padding:7px 8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--tp-color);border-radius:6px}
.ws-tree-node-header:hover{background:var(--tp-hover)}
.ws-tree-node-header.active{background:transparent}
.ws-expand-button{appearance:none;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin:-4px 0 -4px -4px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--tp-meta);cursor:pointer;flex-shrink:0;outline:none;box-shadow:none}
.ws-expand-button:hover{background:var(--tp-hover);color:var(--tp-color)}
.ws-expand-button:focus,.ws-expand-button:focus-visible{outline:none;box-shadow:none}
.ws-chevron{width:16px;height:16px;opacity:.45;transition:transform .15s}
.ws-chevron.open{transform:rotate(90deg)}
.ws-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-session-count{font-size:10.5px;color:var(--tp-meta);flex-shrink:0}
.ws-tree-children{margin-left:14px;padding-left:12px;display:flex;flex-direction:column;gap:1px}
.ws-tree-children.rc-hide{display:none}
.ws-tree-empty-sessions{padding:6px 8px;font-size:12px;color:var(--tp-empty)}
.e{padding:18px;text-align:center;font-size:12px;color:var(--tp-empty);display:flex;align-items:center;justify-content:center;gap:6px}
.e svg.icon{width:14px;height:14px;opacity:.4}
.actions{display:flex;border-top:1px solid var(--tp-border)}
.actions>div{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--tp-color);transition:background .1s}
.actions>div:hover{background:var(--tp-hover)}
.actions>div:first-child{border-right:1px solid var(--tp-border)}
.actions svg.icon{width:15px;height:15px;flex-shrink:0}
</style>
<link rel="stylesheet" href="_components.css" />
</head>
<body>
<div class="header">
  <div class="sub" id="title-sub"></div>
  <div class="seg" id="mode-seg" role="tablist" aria-label="Mode switch">
    <button type="button" class="seg-item active" data-mode="normal" role="tab" aria-selected="true">
      <svg class="seg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span id="seg-chats">Chats</span>
    </button>
    <button type="button" class="seg-item" data-mode="iwork" role="tab" aria-selected="false">
      <svg class="seg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span id="seg-workspaces">Workspaces</span>
    </button>
  </div>
</div>
<div id="sessions-container"></div>
<div class="actions">
  <div id="btn-open">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    <span id="lbl-open">Open Encre</span>
  </div>
  <div id="btn-quit">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    <span id="lbl-quit">Quit</span>
  </div>
</div>
<script>
var LABELS = {
  en: {
    openYim: "Open Encre", sessions: "Sessions", chats: "Chats", workspaces: "Workspace",
    noSessions: "No active sessions", noWorkspaces: "No workspace sessions", quit: "Quit", messages: "msgs"
  },
  zh: {
    openYim: "打开 Encre", sessions: "会话", chats: "聊天", workspaces: "工作区",
    noSessions: "暂无活跃会话", noWorkspaces: "暂无工作区会话", quit: "退出", messages: "条消息"
  }
};
var currentLabels = LABELS.en;
// Selected mode: "normal" or "iwork". Initialized from activeMode on first tray-data.
var currentMode = null;
var sessionsNormal = [];
var sessionsIwork = [];
var wsExpanded = {};

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function truncate(str, max) {
  return str.length > max ? str.slice(0, max - 1) + "…" : str;
}

/* ── Inline SVG icons (Lucide-compatible paths) ── */
var ICONS = {
  chat: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  layers: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
  inbox: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>'
};

function renderSessions(sessions, iconKey, emptyKey) {
  var container = document.getElementById("sessions-container");
  container.innerHTML = "";
  sessions = (sessions || []).filter(function(s) { return (s.message_count || 0) > 0; });

  if (sessions && sessions.length > 0) {
    for (var i = 0; i < sessions.length; i++) {
      var s = sessions[i];
      var name = esc(truncate(s.name || s.preview || (s.session_id || "").slice(0, 8) || "Untitled", 28));
      var runningBadge = s.is_running ? '<span class="session-running"></span>' : "";
      var row = document.createElement("div");
      row.className = "ws-tree-session-item";
      row.setAttribute("data-sid", s.session_id || "");
      row.innerHTML = '<div class="session-item-top"><span class="session-preview">' + name + '</span>' + runningBadge + '</div>';
      container.appendChild(row);
    }
  } else {
    var empty = document.createElement("div");
    empty.className = "e";
    empty.innerHTML = ICONS.inbox + '<span>' + currentLabels[emptyKey] + '</span>';
    container.appendChild(empty);
  }
}

function renderIworkSessions(sessions) {
  var container = document.getElementById("sessions-container");
  container.innerHTML = "";
  sessions = sessions || [];
  if (!sessions || sessions.length === 0) {
    var empty = document.createElement("div");
    empty.className = "e";
    empty.innerHTML = ICONS.inbox + '<span>' + currentLabels.noWorkspaces + '</span>';
    container.appendChild(empty);
    return;
  }
  for (var gi = 0; gi < sessions.length; gi++) {
    var group = sessions[gi];
    var workspace = group.workspace || {};
    var wsKey = workspace.path || "";
    var wsSessions = group.sessions || [];
    var wsName = workspace.name || wsKey.replace(/[/\\]/g, "/").split("/").filter(Boolean).pop() || "?";
    var isExpanded = wsExpanded[wsKey] === true;
    var wsRow = document.createElement("div");
    wsRow.className = "ws-tree-node";
    wsRow.setAttribute("data-ws-path", wsKey);
    wsRow.innerHTML = '<div class="ws-tree-node-header active" data-ws-path="' + esc(wsKey) + '">' +
      '<button type="button" class="ws-expand-button" aria-label="Toggle workspace sessions" aria-expanded="' + (isExpanded ? "true" : "false") + '">' +
      '<svg class="ws-chevron' + (isExpanded ? ' open' : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>' +
      '</button>' +
      '<span class="ws-name">' + esc(wsName) + '</span>' +
      '<span class="ws-session-count">' + wsSessions.length + '</span>' +
      '</div>';
    container.appendChild(wsRow);
    var children = document.createElement("div");
    children.className = "ws-tree-children" + (isExpanded ? "" : " rc-hide");
    children.setAttribute("data-ws-path", wsKey);
    for (var si = 0; si < wsSessions.length; si++) {
      var s2 = wsSessions[si];
      var name2 = esc(truncate(s2.name || s2.preview || (s2.session_id || "").slice(0, 8) || "Untitled", 28));
      var runningBadge2 = s2.is_running ? '<span class="session-running"></span>' : "";
      var row2 = document.createElement("div");
      row2.className = "ws-tree-session-item";
      row2.setAttribute("data-sid", s2.session_id || "");
      row2.innerHTML = '<div class="session-item-top"><span class="session-preview">' + name2 + '</span>' + runningBadge2 + '</div>';
      children.appendChild(row2);
    }
    container.appendChild(children);
  }
}

function render() {
  var labels = currentLabels;
  document.getElementById("lbl-open").textContent = labels.openYim;
  document.getElementById("lbl-quit").textContent = labels.quit;
  document.getElementById("seg-chats").textContent = labels.chats;
  document.getElementById("seg-workspaces").textContent = labels.workspaces;
  document.getElementById("title-sub").innerHTML = '<span>' + labels.sessions + '</span>';

  if (currentMode === "iwork") {
    renderIworkSessions(sessionsIwork);
  } else {
    renderSessions(sessionsNormal, "chat", "noSessions");
  }
}

function setMode(mode) {
  if (mode !== "normal" && mode !== "iwork") return;
  var prevMode = currentMode;
  currentMode = mode;
  var segs = document.querySelectorAll("#mode-seg .seg-item");
  for (var i = 0; i < segs.length; i++) {
    var match = segs[i].getAttribute("data-mode") === mode;
    segs[i].classList.toggle("active", match);
    segs[i].setAttribute("aria-selected", match ? "true" : "false");
  }
  var container = document.getElementById("sessions-container");
  if (prevMode !== null && prevMode !== mode && container) {
    container.classList.add("slide-exit");
    setTimeout(function() {
      container.classList.remove("slide-exit");
      render();
      container.classList.add("slide-enter");
      setTimeout(function() {
        container.classList.remove("slide-enter");
      }, 200);
    }, 180);
  } else {
    render();
  }
}

/* ── Theme application ── */
function applyTheme(theme) {
  if (theme === "dark" || theme === "light") {
    document.documentElement.setAttribute("data-theme", theme);
  }
}

document.getElementById("btn-open").addEventListener("click", function() {
  if (window.electronAPI && window.electronAPI.trayPopupAction) {
    window.electronAPI.trayPopupAction("open", null);
  }
});
document.getElementById("btn-quit").addEventListener("click", function() {
  if (window.electronAPI && window.electronAPI.trayPopupAction) {
    window.electronAPI.trayPopupAction("quit", null);
  }
});
/* ── Safe finder: avoids CSS escape issues with backslashes in paths ── */
function _rcByPath(wsPath) {
  var all = document.querySelectorAll(".ws-tree-children");
  for (var i = 0; i < all.length; i++) {
    if (all[i].getAttribute("data-ws-path") === wsPath) return all[i];
  }
  return null;
}
document.getElementById("sessions-container").addEventListener("click", function(e) {
  var row = e.target.closest ? e.target.closest(".ws-tree-session-item") : null;
  if (row) {
    var sid = row.getAttribute("data-sid");
    if (sid && window.electronAPI && window.electronAPI.trayPopupAction) {
      window.electronAPI.trayPopupAction("open", sid);
    }
    return;
  }
  var rw = e.target.closest ? e.target.closest(".ws-tree-node-header") : null;
  if (rw) {
    var wsKey = rw.getAttribute("data-ws-path");
    if (wsKey) {
      var expandButton = e.target.closest(".ws-expand-button");
      if (expandButton) {
        e.preventDefault();
        e.stopPropagation();
        var expanded = wsExpanded[wsKey] === true;
        wsExpanded[wsKey] = !expanded;
        expandButton.setAttribute("aria-expanded", expanded ? "false" : "true");
        var chev = rw.querySelector(".ws-chevron");
        if (chev) chev.classList.toggle("open");
        var rc = _rcByPath(wsKey);
        if (rc) rc.classList.toggle("rc-hide");
      } else if (window.electronAPI && window.electronAPI.trayPopupAction) {
        window.electronAPI.trayPopupAction("open_workspace", wsKey);
      }
    }
    return;
  }
});
document.getElementById("mode-seg").addEventListener("click", function(e) {
  var seg = e.target.closest ? e.target.closest("[data-mode]") : null;
  if (seg) setMode(seg.getAttribute("data-mode"));
});

if (window.electronAPI && window.electronAPI.onTrayData) {
  window.electronAPI.onTrayData(function(data) {
    currentLabels = LABELS[data.locale] || LABELS.en;
    if (data.theme) {
      applyTheme(data.theme);
    }
    if (data.sessionsNormal) sessionsNormal = data.sessionsNormal;
    if (data.sessionsIwork) sessionsIwork = data.sessionsIwork;
    // Initialize the selected tab from the main window's active mode (first load).
    if (currentMode === null && data.activeMode) {
      setMode(data.activeMode === "iwork" ? "iwork" : "normal");
    } else {
      render();
    }
  });
}

render([]);
</script>
</body>
</html>
